[workspace]
name = "shennong-cell2location"
channels = ["conda-forge"]
# win-64 is excluded because the pinned scvi-tools stack has no matching jaxlib build.
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "==3.11.16"
scanpy = "==1.11.5"
anndata = "==0.12.19"
scvi-tools = "==1.3.3"
pyro-ppl = "==1.9.1"
pandas = "==2.3.3"
scipy = "==1.17.1"
numpy = "==1.26.4"

[pypi-dependencies]
cell2location = "==0.1.5"

[feature.cpu]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.cpu.dependencies]
pytorch-cpu = "==2.5.1"

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "{{ cuda_major }}"

[feature.gpu.dependencies]
pytorch-gpu = "==2.5.1"
cuda-version = "=={{ cuda_version }}"

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
default = ["cpu"]
