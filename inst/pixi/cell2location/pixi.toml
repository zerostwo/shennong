[workspace]
name = "shennong-cell2location"
channels = ["conda-forge"]
platforms = ["{{ platform }}"]

[dependencies]
python = ">=3.10,<3.12"
scanpy = "==1.11.5"
anndata = ">=0.10"
scvi-tools = "==1.3.3"
pyro-ppl = "==1.9.1"
pandas = ">=2"
scipy = ">=1.10"
numpy = "*"

[pypi-dependencies]
cell2location = "==0.1.5"
autozyme = { git = "https://github.com/zerostwo/autozyme.git", rev = "8fc2e9c3a7f70302f97589aaa9b0395dcf86f9bc", subdirectory = "autozyme_py" }

[feature.cpu.dependencies]
pytorch-cpu = "*"

[feature.gpu.system-requirements]
cuda = "{{ cuda_major }}"

[feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "{{ cuda_version }}.*"

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
default = ["cpu"]
