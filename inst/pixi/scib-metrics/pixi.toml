[workspace]
name = "shennong-scib-metrics"
channels = ["conda-forge"]
platforms = ["{{ platform }}"]

[dependencies]
python = ">=3.12,<3.14"
scanpy = ">=1.10"
anndata = ">=0.11"
pandas = ">=2"
scipy = ">=1.12"
numpy = "*"
scikit-learn = "*"
pynndescent = "*"
jax = "*"

[pypi-dependencies]
scib-metrics = ">=0.5.8"

[feature.cpu.dependencies]
jaxlib = { version = "*", build = "*cpu*" }

[feature.gpu.system-requirements]
cuda = "{{ cuda_major }}"

[feature.gpu.dependencies]
jaxlib = { version = "*", build = "*cuda*" }
cuda-version = "{{ cuda_version }}.*"

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
default = ["cpu"]
