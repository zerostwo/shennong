[workspace]
name = "shennong-scib-metrics"
channels = ["conda-forge"]
# win-64 is excluded because conda-forge has no jaxlib 0.6.2 build for Windows.
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "==3.12.14"
scanpy = "==1.11.5"
anndata = "==0.12.19"
pandas = "==2.3.3"
scipy = "==1.17.1"
numpy = "==1.26.4"
scikit-learn = "==1.5.2"
pynndescent = "==0.5.13"

[pypi-dependencies]
scib-metrics = "==0.6.0"

[feature.cpu]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.cpu.dependencies]
jax = "==0.6.2"
jaxlib = "==0.6.2"

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "{{ cuda_major }}"

[feature.gpu.dependencies]
cuda-version = "=={{ cuda_version }}"

[feature.gpu.pypi-dependencies]
jax = { version = "==0.6.2", extras = ["cuda12"] }

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
default = ["cpu"]
