url: https://songqi.org/shennong

development:
  mode: devel

news:
  cran_dates: false

authors:
  Songqi Duan:
    href: https://songqi.org

home:
  sidebar:
    html: pkgdown/sidebar.html

destination: site

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bg: "#fbfdfc"
    fg: "#17231f"
    primary: "#0b6b63"
    secondary: "#536d66"
    success: "#247a52"
    danger: "#a33a45"
    border-color: "#d9e5e1"
    code-bg: "#eef6f3"
    code-color: "#194d47"
    navbar-light-bg: "#f2f8f6"
    navbar-dark-bg: "#12211e"
    border-radius: "0.8rem"
    btn-border-radius: "999px"

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    intro:
      text: Overview
      href: index.html
    articles:
      text: Research workflows
      menu:
        - text: Start here
        - text: From samples to evidence
          href: articles/research-workflow-map.html
        - text: -------
        - text: Build a single-cell study
        - text: Preprocessing and QC
          href: articles/preprocessing-qc.html
        - text: Clustering and integration
          href: articles/clustering.html
        - text: Annotation and pathways
          href: articles/annotation-pathways.html
        - text: -------
        - text: Extend the biological question
        - text: Trajectory and dynamics
          href: articles/trajectory-dynamics.html
        - text: Spatial workflows
          href: articles/spatial-workflows.html
        - text: Bulk transcriptomics
          href: articles/bulk-transcriptomics.html
        - text: -------
        - text: Make the analysis auditable
        - text: Results and method contracts
          href: articles/analysis-results-and-methods.html
        - text: Runtime observability
          href: articles/runtime-observability.html
    reference:
      text: Function reference
      href: reference/index.html
    news:
      text: Changes
      href: news/index.html

articles:
  - title: Choose a research path
    navbar: Articles
    desc: Start with the biological question, then follow the linked real-data workflow.
    contents:
      - research-workflow-map
  - title: Build and validate a single-cell study
    desc: Move from materialized observations through QC, integration, annotation, and figures.
    contents:
      - data-io-projects
      - preprocessing-qc
      - clustering
      - layered-workflows
      - metrics-diagnostics
      - annotation-pathways
      - visualization
      - publication-figures
  - title: Compare states and explain mechanisms
    desc: Test sample-level changes, model cell-state mechanisms, and follow biological dynamics.
    contents:
      - composition-analysis
      - abundance-priority
      - communication-consensus
      - program-discovery-grn
      - trajectory-dynamics
      - velocity-fate
      - cnv-metabolism
      - spatial-workflows
  - title: Translate across assays and cohorts
    desc: Connect single-cell references to bulk cohorts, clinical endpoints, and interpretation-ready evidence.
    contents:
      - bulk-deconvolution
      - bulk-transcriptomics
      - interpretation-workflows
  - title: Reproducibility, performance, and governance
    desc: Discover backend status, retain versioned results, inspect runtime, and interpret acceleration safely.
    contents:
      - analysis-results-and-methods
      - runtime-observability
      - autozyme-benchmarks

