name: test-coverage

on:
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'data/**'
      - 'inst/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'data/**'
      - 'inst/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::xml2
            any::testthat
            any::Seurat
            any::SeuratObject
            any::misc3d
            any::htmlwidgets
            any::chromote
            any::png
            github::carmonalab/SignatuR
            github::immunogenomics/harmony@harmony2
            any::HGNChelper
            any::leidenbase
            any::rio
            any::anndataR
            any::hdf5r
            any::data.table
            any::clusterProfiler
            any::msigdbr
            github::catplot/catplot
            github::genecell/COSGR
            bioc::org.Hs.eg.db
            bioc::SingleCellExperiment
            bioc::SummarizedExperiment
            bioc::celda
            bioc::limma
            bioc::scran
            bioc::scDblFinder
            bioc::rhdf5
            bioc::rtracklayer
            bioc::DESeq2
            bioc::edgeR

      - name: Test coverage
        run: |
          coverage_library <- file.path(Sys.getenv("RUNNER_TEMP"), "coverage-library")
          cov <- tryCatch(
            covr::package_coverage(install_path = coverage_library, clean = FALSE),
            error = function(error) {
              logs <- list.files(
                coverage_library, pattern = "[.]Rout([.]fail)?$",
                recursive = TRUE, full.names = TRUE
              )
              for (log in logs) {
                cat("\nTest output:", log, "\n")
                cat(tail(readLines(log, warn = FALSE), 200L), sep = "\n")
              }
              stop(error)
            }
          )
          covr::to_cobertura(cov, filename = "coverage.xml")
        shell: Rscript {0}

      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-output
          path: ${{ runner.temp }}/coverage-library/**/*.Rout*
          if-no-files-found: ignore

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: true
