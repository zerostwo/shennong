name: backend-conformance

on:
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/conformance/**'
      - 'inst/methods/**'
      - 'inst/pixi/**'
      - 'scripts/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/backend-conformance.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'inst/conformance/**'
      - 'inst/methods/**'
      - 'inst/pixi/**'
      - 'scripts/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/backend-conformance.yaml'
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 1'

concurrency:
  group: backend-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-conformance:
    runs-on: ubuntu-latest
    env:
      SHENNONG_CONFORMANCE_STRICT: 'true'
      SHENNONG_ACCELERATION_DISABLED: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::Seurat
            any::SeuratObject
            any::msigdbr
            bioc::clusterProfiler
            bioc::edgeR@4.10.3

      - name: Configure isolated Python runtime
        run: echo "SHENNONG_RUNTIME_DIR=$RUNNER_TEMP/shennong-runtime" >> "$GITHUB_ENV"

      - name: Cache conformance Python environments
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SHENNONG_RUNTIME_DIR }}/pixi
            ~/.pixi/bin
          key: conformance-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('inst/pixi/popv/**', 'inst/pixi/scrublet/**', 'inst/conformance/contracts/*.json', 'scripts/prepare-conformance-python.R') }}

      - name: Install pinned conformance Python environments
        run: Rscript scripts/prepare-conformance-python.R

      - name: Run static admission and micro-differential contracts
        run: |
          testthat::test_local(
            filter = "backend-conformance",
            stop_on_failure = TRUE
          )
        shell: Rscript {0}
