name: pkgdown

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Clean and rebuild every reference page and article
        required: false
        default: true
        type: boolean

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      PKGDOWN_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # v2 drops the cache created before RcppParallel 6 changed the TBB ABI.
          cache-version: '2'
          dependencies: '"hard"'
          # Keep optional packages here when executable articles require them.
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::msigdbr
            any::Seurat
            any::hdf5r
            any::leidenbase
            any::qs2
            any::rio
            github::carmonalab/SignatuR
            github::immunogenomics/harmony@harmony2
            any::clusterProfiler
            bioc::org.Hs.eg.db
            bioc::UCell
            any::HGNChelper
            github::catplot/catplot
            github::immunogenomics/lisi
          needs: website

      - name: Validate cached native dependencies
        run: |
          Rscript - <<'RSCRIPT'
          stringfish_ok <- tryCatch(
            {
              loadNamespace("stringfish")
              TRUE
            },
            error = function(error) {
              message("Cached stringfish failed to load: ", conditionMessage(error))
              FALSE
            }
          )

          if (!stringfish_ok) {
            message(
              "Rebuilding stringfish from source against the active ",
              "RcppParallel/TBB."
            )
            install.packages(
              "stringfish",
              repos = getOption("repos"),
              type = "source",
              dependencies = FALSE
            )
            loadNamespace("stringfish")
          }
          RSCRIPT
        shell: bash

      - name: Install package
        run: R CMD INSTALL .
        shell: bash

      - name: Build site
        run: |
          if [ "${PKGDOWN_FULL}" = "true" ]; then
            Rscript scripts/build-pkgdown.R --full
          else
            Rscript scripts/build-pkgdown.R
          fi
        shell: bash

      - name: Deploy successful main build
        if: github.ref == 'refs/heads/main'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash scripts/deploy-pkgdown.sh
        shell: bash

      - name: Build and verify GitHub Pages
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq .object.sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          # A newer Pages build can supersede the initially requested build.
          build_url="repos/$GITHUB_REPOSITORY/pages/builds/latest"
          for attempt in {1..60}; do
            read -r status commit < <(gh api "$build_url" --jq '[.status, .commit] | @tsv')
            if [ "$status" = "built" ] && [ "$commit" = "$published_commit" ]; then
              echo "GitHub Pages published $commit"
              exit 0
            fi
            echo "Waiting for Pages commit $published_commit (latest: $status $commit)"
            sleep 10
          done
          gh api "$build_url"
          echo "GitHub Pages did not publish $published_commit within ten minutes."
          exit 1
        shell: bash
