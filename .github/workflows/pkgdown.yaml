name: pkgdown

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Clean and rebuild every reference page and article
        required: false
        default: true
        type: boolean

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      PKGDOWN_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # v2 drops the cache created before RcppParallel 6 changed the TBB ABI.
          cache-version: '2'
          dependencies: '"hard"'
          # Keep optional packages here when executable articles require them.
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            github::tidyverse/tidytemplate
            any::msigdbr
            any::Seurat
            any::hdf5r
            any::leidenbase
            any::qs2
            any::rio
            github::carmonalab/SignatuR
            github::immunogenomics/harmony@harmony2
            any::clusterProfiler
            bioc::org.Hs.eg.db
            bioc::UCell
            any::HGNChelper
            github::catplot/catplot
            github::immunogenomics/lisi
          needs: website

      - name: Validate cached native dependencies
        run: |
          Rscript - <<'RSCRIPT'
          stringfish_ok <- tryCatch(
            {
              loadNamespace("stringfish")
              TRUE
            },
            error = function(error) {
              message("Cached stringfish failed to load: ", conditionMessage(error))
              FALSE
            }
          )

          if (!stringfish_ok) {
            message(
              "Rebuilding stringfish from source against the active ",
              "RcppParallel/TBB."
            )
            install.packages(
              "stringfish",
              repos = getOption("repos"),
              type = "source",
              dependencies = FALSE
            )
            loadNamespace("stringfish")
          }
          RSCRIPT
        shell: bash

      - name: Install package
        run: R CMD INSTALL .
        shell: bash

      - name: Build site without deployment
        run: |
          if [ "${PKGDOWN_FULL}" = "true" ]; then
            Rscript scripts/build-pkgdown.R --full
          else
            Rscript scripts/build-pkgdown.R
          fi
        shell: bash
